<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participating Hospitals — BloodLink Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50 text-slate-900 antialiased">
  <!-- Minimal Header -->
  <header class="w-full bg-white border-b border-slate-200 py-3.5 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 rounded-lg bg-red-600 text-white flex items-center justify-center font-bold shadow-xs">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <span class="font-extrabold text-sm tracking-tight text-slate-900">Blood<span class="text-red-600">Link</span></span>
      </a>
      <div class="flex items-center gap-3">
        <!-- Authenticated State: User & Log Out Button -->
        <div class="hidden flex items-center gap-2" data-auth-only>
          <span class="text-xs text-slate-600 font-medium flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span data-user-name class="font-semibold">User</span>
          </span>
          <button 
            type="button" 
            data-logout-btn
            class="px-2.5 py-1 text-xs font-semibold rounded-lg text-rose-600 hover:bg-rose-50 border border-rose-200 transition-colors flex items-center gap-1 cursor-pointer shadow-xs"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
            <span>Log Out</span>
          </button>
        </div>
        <a href="/" class="text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors">← Back to Home</a>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl p-8 border border-slate-200 shadow-sm text-center">
      <div class="w-12 h-12 mx-auto rounded-xl bg-red-100 text-red-600 flex items-center justify-center font-bold mb-4">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-slate-900 mb-2">Hospital Network Directory</h1>
      <p class="text-sm text-slate-500 mb-6">Scheduled for Phase 4 (Organization Management).</p>
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <a href="/" class="w-full sm:w-auto px-4 py-2 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">Return to Home</a>
        <button type="button" data-logout-btn class="hidden w-full sm:w-auto px-4 py-2 text-xs font-semibold rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 transition-colors cursor-pointer" data-auth-only>Log Out</button>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
    © BloodLink Platform
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
